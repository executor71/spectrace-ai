services:
  mcp-server:
    environment:
      WORKFLOW_SUMMARY_LOG: ${WORKFLOW_SUMMARY_LOG:-false}
      PYTHONUNBUFFERED: "1"
    build:
      context: .
      dockerfile: mcp-server/Dockerfile
    ports:
      - "127.0.0.1:8020:8020"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

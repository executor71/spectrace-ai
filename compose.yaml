services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: legacy_assistant
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_postgres_only}
      DB_MIGRATION_PASSWORD: ${DB_MIGRATION_PASSWORD:-local_migration_only}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:-local_app_only}
      RAG_DB_PASSWORD: ${RAG_DB_PASSWORD:-local_rag_reader_only}
      EVALUATION_DB_PASSWORD: ${EVALUATION_DB_PASSWORD:-local_evaluation_reader_only}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d legacy_assistant"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    volumes:
      - ./contracts:/contracts:ro
    environment:
      AI_SERVICE_URL: http://ai-service:8000
      ANALYSIS_TIMEOUT_SECONDS: "630"
      DB_HOST: postgres
      DB_NAME: legacy_assistant
      DB_APP_USER: app_user
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:-local_app_only}
      DB_MIGRATION_USER: migration_owner
      DB_MIGRATION_PASSWORD: ${DB_MIGRATION_PASSWORD:-local_migration_only}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  ai-service:
    build: ./ai-service
    environment:
      ANALYSIS_LLM_URL: http://ollama:11434
      ANALYSIS_LLM_THINK: ${ANALYSIS_LLM_THINK:-false}
      ANALYSIS_LLM_MODEL: ${ANALYSIS_LLM_MODEL:-qwen2.5:7b-instruct}
      ANALYSIS_LLM_TIMEOUT_SECONDS: ${ANALYSIS_LLM_TIMEOUT_SECONDS:-300}
      RAG_DB_HOST: postgres
      RAG_DB_NAME: legacy_assistant
      RAG_DB_USER: rag_reader
      RAG_DB_PASSWORD: ${RAG_DB_PASSWORD:-local_rag_reader_only}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-}
      EMBEDDING_REVISION: ${EMBEDDING_REVISION:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-}
      HF_HUB_DISABLE_XET: "1"
      HF_HUB_DOWNLOAD_TIMEOUT: "30"
      TOKENIZERS_PARALLELISM: "false"
    volumes:
      - embedding-model-cache:/models
      - ./contracts:/contracts:ro
    ports:
      - "8000:8000"
    depends_on:
      analysis-model-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  ollama:
    image: ollama/ollama:0.11.10
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes:
      - analysis-model-cache:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30

  analysis-model-init:
    image: ollama/ollama:0.11.10
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull"]
    command: ["${ANALYSIS_LLM_MODEL:-qwen2.5:7b-instruct}"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
      - ai-service

volumes:
  postgres-data:
  embedding-model-cache:
  analysis-model-cache:
